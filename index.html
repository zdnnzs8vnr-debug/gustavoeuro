const LOCALES = { it:'it-IT', es:'es-ES', en:'en-GB', fr:'fr-FR' };
const money = (v, lang) => new Intl.NumberFormat(LOCALES[lang]||'it-IT', { style:'currency', currency:'EUR' }).format(v);
const num = (v, lang) => new Intl.NumberFormat(LOCALES[lang]||'it-IT').format(v);
const clsx = (...a) => a.filter(Boolean).join(' ');
const resolve = (obj, path) => path.split('.').reduce((o,k) => (o && o[k] !== undefined ? o[k] : undefined), obj);
const isMobile = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
async function copyText(text){ try { await navigator.clipboard.writeText(text); return true; } catch { return false; } }

function buildOrderMessage(items, ship, lang){
  const lines = items.map(i => `• ${i.title} — ${i.sub} × ${i.qty} = ${money(i.unit*i.qty, lang)}`);
  const total = items.reduce((t,i) => t + i.unit*i.qty, 0);
  return ['🟡 NUOVO ORDINE — GUSTAVOEURO','', ...lines, '', `TOTALE: ${money(total, lang)}`, '',
    'DATI SPEDIZIONE', `Indirizzo: ${ship.address} ${ship.civic}`, `CAP: ${ship.zip}`,
    `Email: ${ship.email}`, `Cellulare: ${ship.prefix} ${ship.phone}`,
    `Corriere: ${ship.shipper}${ship.locker ? ` — Locker: ${ship.locker}` : ''}`].join('\n');
}

============================================================ */
function useRoute(){
  const [path, setPath] = useState(() => (window.location.hash || '#/').slice(1) || '/');
  useEffect(() => {
    const on = () => { setPath((window.location.hash || '#/').slice(1) || '/'); window.scrollTo(0,0); };
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  return path;
}
const nav = (p) => { window.location.hash = p; };

const I18nCtx = createContext();
function I18nProvider({ children }){
  const [lang, setLang] = useState(() => localStorage.getItem('ge-lang') || 'it');
  useEffect(() => { localStorage.setItem('ge-lang', lang); document.documentElement.lang = lang; }, [lang]);
  const t = useCallback((k, vars) => {
    let v = resolve(T[lang], k);
    if (v === undefined) v = resolve(T.it, k);
    if (typeof v === 'string' && vars) for (const key in vars) v = v.replace(`{${key}}`, vars[key]);
    return v;
  }, [lang]);
  return <I18nCtx.Provider value={{ lang, setLang, t }}>{children}</I18nCtx.Provider>;
}
const useT = () => useContext(I18nCtx);

const CartCtx = createContext();
function CartProvider({ children }){
  const [items, setItems] = useState(() => { try { return JSON.parse(localStorage.getItem('ge-cart')) || []; } catch { return []; } });
  const [open, setOpen] = useState(false);
  useEffect(() => { localStorage.setItem('ge-cart', JSON.stringify(items)); }, [items]);
  const add = useCallback((item) => setItems(prev => {
    const ex = prev.find(i => i.id === item.id);
    if (ex) return prev.map(i => i.id === item.id ? { ...i, qty: i.qty + item.qty } : i);
    return [...prev, item];
  }), []);
  const remove = useCallback(id => setItems(p => p.filter(i => i.id !== id)), []);
  const setQty = useCallback((id, qty) => setItems(p => p.map(i => i.id === id ? { ...i, qty: Math.max(1, qty) } : i)), []);
  const clear = useCallback(() => setItems([]), []);
  const total = items.reduce((t,i) => t + i.unit*i.qty, 0);
  const count = items.reduce((n,i) => n + i.qty, 0);
  return <CartCtx.Provider value={{ items, open, setOpen, add, remove, setQty, clear, total, count }}>{children}</CartCtx.Provider>;
}
const useCart = () => useContext(CartCtx);

const OrderCtx = createContext();
const EMPTY_SHIP = { address:'', civic:'', zip:'', email:'', prefix:'+39', phone:'', shipper:'', locker:'' };
function OrderProvider({ children }){
  const [order, setOrder] = useState(() => { try { return JSON.parse(localStorage.getItem('ge-order')) || { shipping: EMPTY_SHIP, paypalEmail:'', method:'', coin:'', voucher:'' }; } catch { return { shipping: EMPTY_SHIP, paypalEmail:'', method:'', coin:'', voucher:'' }; } });
  useEffect(() => { localStorage.setItem('ge-order', JSON.stringify(order)); }, [order]);
  const setShipping = useCallback(p => setOrder(o => ({ ...o, shipping: { ...o.shipping, ...p } })), []);
  const set = useCallback(p => setOrder(o => ({ ...o, ...p })), []);
  return <OrderCtx.Provider value={{ order, setShipping, set }}>{children}</OrderCtx.Provider>;
}
const useOrder = () => useContext(OrderCtx);

function CryptoLoading(){
  const { t } = useT();
  const [p, setP] = useState(1);
  useEffect(() => {
    const start = performance.now(), dur = 2600;
    let raf;
    const tick = (now) => {
      const k = Math.min(1, (now - start) / dur);
      setP(Math.max(1, Math.round(k * 100)));
      if (k < 1) raf = requestAnimationFrame(tick); else setTimeout(() => nav('/home'), 350);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);
  const line = p < 40 ? t('cryptoLoading.l1') : p < 75 ? t('cryptoLoading.l2') : t('cryptoLoading.l3');
  return (
    <div className="flex min-h-dvh flex-col items-center justify-center px-6">
      <h1 className="gold-text text-xl sm:text-2xl">{t('cryptoLoading.title')}</h1>
      <p className="mt-3 text-sm text-crypto">{line}…</p>
      <div className="mt-8 h-1 w-full max-w-md overflow-hidden rounded-full bg-graphite2">
        <div className="h-full bg-gradient-to-r from-gold to-goldsoft" style={{ width: p + '%', transition:'width .1s linear' }} />
      </div>
      <p className="mt-4 font-mono text-3xl text-gold">{String(p).padStart(3,'0')}%</p>
      {p === 100 && <p className="mt-3 text-xs uppercase tracking-[0.3em] text-crypto">{t('cryptoLoading.done')}</p>}
    </div>
  );
}

function PaypalVerify({ price }){
  const { t } = useT();
  const { set } = useOrder();
  const [phase, setPhase] = useState('telegram');
  const [no, setNo] = useState(false);
  const [a, setA] = useState(''), [b, setB] = useState('');
  const [err, setErr] = useState(false);

  const verify = (e) => {
    e.preventDefault();
    if (!a || a.trim().toLowerCase() !== b.trim().toLowerCase()) { setErr(true); return; }
    setErr(false); setPhase('verifying'); set({ paypalEmail: a.trim() });
    setTimeout(() => nav('/checkout/payment'), 1600);
  };

  return (
    <Page>
      {phase === 'telegram' && (
        <GlassPanel className="space-y-4 text-center">
          <h1 className="gold-text text-lg">{t('paypal.telegramQ')}</h1>
          <a href={TELEGRAM.direct} target="_blank" rel="noreferrer"><Button className="w-full">{t('paypal.telegramYes')}</Button></a>
          <Button variant="ghost" className="w-full" onClick={() => setNo(true)}>{t('paypal.telegramNo')}</Button>
          {no && <BackButton />}
          <button className="text-xs text-gold underline" onClick={() => setPhase('email')}>→ {t('paypal.emailTitle')}</button>
        </GlassPanel>
      )}
      {phase === 'email' && (
        <GlassPanel className="space-y-4">
          <h1 className="gold-text text-center text-lg">{t('paypal.emailTitle')}</h1>
          <p className="text-center text-xs text-cream/60">{t('paypal.emailHint')}</p>
          <form onSubmit={verify} className="space-y-3">
            <input className="input" placeholder={t('paypal.emailPh')} value={a} onChange={e => setA(e.target.value)} />
            <input className="input" placeholder={t('paypal.emailRepeat')} value={b} onChange={e => setB(e.target.value)} />
            {err && <p className="text-xs text-red-400">{t('paypal.mismatch')}</p>}
            <Button type="submit" className="w-full">{t('paypal.verify')}</Button>
          </form>
          <div className="flex justify-center"><BackButton /></div>
        </GlassPanel>
      )}
      {phase === 'verifying' && (
        <div className="flex flex-col items-center gap-5 py-20">
          <div className="h-10 w-10 animate-spin rounded-full border-2 border-gold/30 border-t-gold" style={{ animation:'spin 1s linear infinite' }} />
          <p className="text-sm tracking-widest text-gold">{t('paypal.verifying')}…</p>
        </div>
      )}
      <p className="mt-4 text-center text-xs text-cream/40">PayPal · {price} €</p>
    </Page>
  );
}

            <button onClick={() => setOpen(open === i ? null : i)} className="flex w-full items-center justify-between px-5 py-4 text-left">
              <span className="font-serif tracking-[0.1em] text-cream">{it.h}</span>
              <span className="text-gold transition-transform" style={{ transform: open===i ? 'rotate(45deg)' : 'none' }}>+</span>
            </button>
            <div className="grid transition-all duration-300" style={{ gridTemplateRows: open===i ? '1fr' : '0fr' }}>
              <div className="overflow-hidden">
                <div className="px-5 pb-5 text-sm leading-relaxed text-cream/75">
                  {it.p}
                  {it.list && <ul className="mt-2 space-y-1">{it.list.map((l, k) => <li key={k} className="text-crypto">✓ {l}</li>)}</ul>}
                </div>
              </div>
            </div>
          </li>
        ))}
      </ul>
      <div className="mt-8 flex justify-center"><BackButton to="/home" /></div>
    </Page>
  );
}

function Legal({ doc }){
  const { t } = useT();
  const sections = t(doc + '.sections');
  return (
    <Page>
      <h1 className="gold-text text-center text-xl">{t(doc + '.title')}</h1>
      <p className="mt-3 text-center text-xs italic text-cream/50">{t(doc + '.updated')}</p>
      <div className="mt-8 space-y-6">
        {sections.map((s, i) => (
          <section key={i}>
            <h2 className="mb-2 font-serif text-sm tracking-[0.16em] text-gold">{s.h}</h2>
            <p className="text-sm leading-relaxed text-cream/75">{s.p}</p>
          </section>
        ))}
      </div>
      <div className="mt-10 flex justify-center"><BackButton to="/home" /></div>
    </Page>
  );
}

/* ============================================================
   14. CHECKOUT
============================================================ */
function Shipping(){
  const { t } = useT();
  const { order, setShipping } = useOrder();
  const s = order.shipping;
  const [err, setErr] = useState(false);

  const submit = (e) => {
    e.preventDefault();
    if (!s.address || !s.civic || !s.zip || !s.email || !s.phone || !s.shipper) { setErr(true); return; }
    setErr(false); nav('/checkout/payment');
  };

  return (
    <Page>
      <h1 className="gold-text mb-6 text-center text-xl">{t('ship.title')}</h1>
      <GlassPanel>
        <form onSubmit={submit} className="space-y-3">
          <input className="input" placeholder={t('ship.address')} value={s.address} onChange={e => setShipping({ address:e.target.value })} />
          <div className="grid grid-cols-2 gap-3">
            <input className="input" placeholder={t('ship.civic')} value={s.civic} onChange={e => setShipping({ civic:e.target.value })} />
            <input className="input" placeholder={t('ship.zip')} value={s.zip} onChange={e => setShipping({ zip:e.target.value })} />
          </div>
          <input type="email" className="input" placeholder={t('ship.email')} value={s.email} onChange={e => setShipping({ email:e.target.value })} />
          <div className="flex gap-3">
            <select className="input w-28" value={s.prefix} onChange={e => setShipping({ prefix:e.target.value })}>
              {PREFIXES.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
            <input className="input" placeholder={t('ship.phone')} value={s.phone} onChange={e => setShipping({ phone:e.target.value })} />
          </div>
          <p className="pt-2 text-xs uppercase tracking-widest text-cream/50">{t('ship.carrier')}</p>
          <div className="flex flex-wrap gap-2">
            {SHIPPERS.map(sh => (
              <button type="button" key={sh} onClick={() => setShipping({ shipper: sh, locker: sh === 'LOCKER INPOST' ? s.locker : '' })}
                className={clsx('rounded-full border px-4 py-2 text-xs tracking-widest transition-all',
                  s.shipper === sh ? 'border-gold bg-gold/15 text-gold' : 'border-gold/20 text-cream/70 hover:border-gold/50')}>{sh}</button>
            ))}
          </div>
          {s.shipper === 'LOCKER INPOST' && <input className="input" placeholder={t('ship.locker')} value={s.locker} onChange={e => setShipping({ locker:e.target.value })} />}
          <p className="pt-2 text-center text-xs text-crypto">✓ {t('ship.free')} — {t('common.tracking')}</p>
          {err && <p className="text-center text-xs text-red-400">{t('ship.required')}</p>}
          <Button type="submit" className="w-full">{t('ship.next')}</Button>
        </form>
      </GlassPanel>
      <div className="mt-6 flex justify-center"><BackButton /></div>
    </Page>
  );
}

function Payment(){
  const { t } = useT();
  const { set } = useOrder();
  const methods = [
    { id:'crypto', title:t('pay.crypto'), sub:t('pay.cryptoSub'), to:'/checkout/crypto' },
    { id:'bank', title:t('pay.bank'), sub:'', to:'/checkout/bank' },
    { id:'amazon', title:t('pay.amazon'), sub:'', to:'/checkout/amazon' },
  ];
  return (
    <Page>
      <p className="mb-2 text-center text-[10px] uppercase tracking-[0.3em] text-crypto">{t('pay.secure')}</p>
      <h1 className="gold-text mb-8 text-center text-xl">{t('pay.accept')}</h1>
      <ul className="space-y-3">
        {methods.map(m => (
          <li key={m.id}>
            <button onClick={() => { set({ method:m.id }); nav(m.to); }}
              className="w-full rounded-2xl border border-gold/15 bg-graphite/40 px-6 py-5 text-left transition-all hover:border-gold/50 hover:shadow-glow">
              <span className="font-serif text-lg tracking-[0.18em] text-cream">{m.title}</span>
              {m.sub && <p className="mt-1 text-xs text-cream/50">{m.sub}</p>}
            </button>
          </li>
        ))}
      </ul>
      <div className="mt-8 flex justify-center"><BackButton to="/checkout/shipping" /></div>
    </Page>
  );
}

function Crypto(){
  const { t } = useT();
  const { set } = useOrder();
  const [phase, setPhase] = useState('wallet');
  const [no, setNo] = useState(false);
  const [coin, setCoin] = useState(null);

  return (
    <Page>
      {phase === 'wallet' && (
        <GlassPanel className="space-y-4 text-center">
          <h1 className="gold-text text-lg">{t('crypto.walletQ')}</h1>
          <Button className="w-full" onClick={() => setPhase('confirm')}>{t('crypto.walletYes')}</Button>
          <Button variant="ghost" className="w-full" onClick={() => setNo(true)}>{t('crypto.walletNo')}</Button>
          {no && <BackButton />}
        </GlassPanel>
      )}
      {phase === 'confirm' && (
        <GlassPanel className="space-y-4">
          <h1 className="gold-text text-center text-lg">{t('crypto.confirm')}</h1>
          <p className="text-center text-xs uppercase tracking-widest text-cream/50">{t('crypto.choose')}</p>
          <div className="grid gap-3">
            {COINS.map(c => (
              <button key={c.id} onClick={() => { setCoin(c); set({ coin:c.id }); setPhase('addr'); }}
                className="rounded-xl border border-gold/20 px-5 py-4 text-left transition-all hover:border-gold/60 hover:bg-gold/5">
                <span className="font-serif tracking-[0.16em] text-gold">{c.label}</span>
              </button>
            ))}
          </div>
          <BackButton />
        </GlassPanel>
      )}
      {phase === 'addr' && coin && <CryptoAddress coin={coin} />}
    </Page>
  );
}

function CryptoAddress({ coin }){
  const { t } = useT();
  const [copied, setCopied] = useState(false);
  const [dot, setDot] = useState(true);
  useEffect(() => { const i = setInterval(() => setDot(d => !d), 900); return () => clearInterval(i); }, []);
  return (
    <GlassPanel className="space-y-5 text-center">
      <h1 className="gold-text text-lg">{coin.label}</h1>
      <p className="break-all rounded-xl border border-gold/20 bg-graphite2/70 px-4 py-3 font-mono text-xs text-cream/90">{coin.address}</p>
      <Button variant="ghost" onClick={async () => { if (await copyText(coin.address)) { setCopied(true); setTimeout(() => setCopied(false), 1500); } }}>
        {copied ? t('common.copied') : t('common.copy')}
      </Button>
      <div className="flex items-center justify-center gap-2 text-xs text-cream/70">
        <span className="h-2.5 w-2.5 rounded-full bg-crypto" style={{ animation:'blink 1s ease-in-out infinite', opacity: dot ? 1 : 0.15 }} />
        {coin.chain === 'exchange' ? t('crypto.waitExchange') : t('crypto.waitChain')}
      </div>
      <Button className="w-full" onClick={() => nav('/checkout/processing')}>{t('crypto.completed')}</Button>
      <BackButton />
    </GlassPanel>
  );
}

function Processing(){
  const { t } = useT();
  const [failed, setFailed] = useState(false);
  useEffect(() => { const id = setTimeout(() => setFailed(true), 6000); return () => clearTimeout(id); }, []);
  return (
    <Page>
      <div className="flex flex-col items-center gap-6 py-16 text-center">
        <div className="h-14 w-14 rounded-full border-2 border-gold/30 border-t-gold" style={{ animation:'spin 1s linear infinite' }} />
        <h1 className="gold-text text-xl">{t('crypto.processing')}</h1>
        <p className="text-xs uppercase tracking-[0.24em] text-cream/50">{t('crypto.info')}</p>
        <a href={TELEGRAM.direct} target="_blank" rel="noreferrer" className="text-gold underline">t.me/gustavoeuro</a>
        <p key={failed ? 'f' : 'p'} className={clsx('max-w-md animate-fadeUp text-sm font-semibold tracking-wide', failed ? 'text-red-400' : 'text-cream/80')}>
          {failed ? t('crypto.failed') : t('crypto.pending')}
        </p>
      </div>
    </Page>
  );
}

function BankTransfer(){
  const { t, lang } = useT();
  const [no, setNo] = useState(false);
  const { order } = useOrder();
  const { items } = useCart();
  const open = async () => { await copyText(buildOrderMessage(items, order.shipping, lang)); window.open(TELEGRAM.direct, '_blank'); };
  return (
    <Page>
      <GlassPanel className="space-y-4 text-center">
        <h1 className="gold-text text-lg">{t('bankTransfer.q')}</h1>
        <p className="text-xs text-cream/50">{t('bankTransfer.hint')}</p>
        <Button className="w-full" onClick={open}>{t('bankTransfer.yes')}</Button>
        <Button variant="ghost" className="w-full" onClick={() => setNo(true)}>{t('bankTransfer.no')}</Button>
        {no && <BackButton />}
      </GlassPanel>
      <div className="mt-6 flex justify-center"><BackButton to="/checkout/payment" /></div>
    </Page>
  );
}

function Amazon(){
  const { t } = useT();
  const [phase, setPhase] = useState('ask');
  const { order, set } = useOrder();
  const send = () => {
    const msg = encodeURIComponent(`BUONO AMAZON — GUSTAVOEURO\nCodice: ${order.voucher}`);
    window.open(`${TELEGRAM.direct}?text=${msg}`, '_blank');
  };
  return (
    <Page>
      {phase === 'ask' ? (
        <GlassPanel className="space-y-4 text-center">
          <h1 className="gold-text text-lg">{t('amazon.q')}</h1>
          <Button className="w-full" onClick={() => setPhase('code')}>{t('amazon.yes')}</Button>
          <BackButton to="/checkout/payment" />
        </GlassPanel>
      ) : (
        <GlassPanel className="space-y-4">
          <h1 className="gold-text text-center text-lg">{t('amazon.insert')}</h1>
          <input className="input text-center tracking-widest" placeholder={t('amazon.codePh')} value={order.voucher} onChange={e => set({ voucher:e.target.value.toUpperCase() })} />
          <Button className="w-full" onClick={send} disabled={!order.voucher}>{t('amazon.send')}</Button>
          <BackButton />
        </GlassPanel>
      )}
    </Page>
  );
}

/* ============================================================
   15. APP
============================================================ */
function Router(){
  const path = useRoute();
  const seg = path.split('/').filter(Boolean);
  const root = seg[0];

  if (!root) return <BootLoading />;
  if (root === 'gate') return <AccessGate />;
  if (root === 'crypto-loading') return <CryptoLoading />;

  let page = null;
  if (root === 'home') page = <Home />;
  else if (root === 'contact') page = <Contact />;
  else if (root === 'banknotes') page = seg[1] ? <BanknoteTier denom={seg[1]} /> : <Banknotes />;
  else if (root === 'paypal') page = seg[1] === 'verify' ? <PaypalVerify price={seg[2]} /> : <Paypal />;
  else if (root === 'reviews') page = <Reviews />;
  else if (root === 'faq') page = <Faq />;
  else if (root === 'privacy' || root === 'terms' || root === 'cookies') page = <Legal doc={root} />;
  else if (root === 'checkout') {
    const s = seg[1];
    if (s === 'shipping') page = <Shipping />;
    else if (s === 'payment') page = <Payment />;
    else if (s === 'crypto') page = <Crypto />;
    else if (s === 'bank') page = <BankTransfer />;
    else if (s === 'amazon') page = <Amazon />;
    else if (s === 'processing') page = <Processing />;
    else page = <Shipping />;
  }
  else page = <Home />;

  return (
    <>
      <Header />
      {page}
      <Footer />
      <CartDrawer />
    </>
  );
}

function App(){
  return (
    <I18nProvider>
      <CartProvider>
        <OrderProvider>
          <Router />
        </OrderProvider>
      </CartProvider>
    </I18nProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

@keyframes spin { to { transform: rotate(360deg); } }
